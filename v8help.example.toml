# Пример конфигурации v8help. Скопируйте в v8help.toml и укажите свои пути.
# Реальный v8help.toml не должен попадать в git (см. .gitignore).

# Каталог bin установленной платформы 1С:Предприятие.
bin_dir = "C:/Program Files/1cv8/8.5.1.1423/bin"

# Промежуточный markdown-корпус и итоговая БД.
corpus_dir = "data/corpus"
db_path = "data/v8help.db"

# Язык по умолчанию: ru (файлы *_ru.hbk) или en (*_root.hbk).
lang = "ru"

# Книги по умолчанию (shorthand через bin_dir/<книга>.hbk).
books = ["shcntx_ru", "shlang_ru", "shquery_ru", "shclang_ru"]

# Явные источники (альтернатива books/bin_dir).
# [[sources]]
# id = "shquery"
# hbk = "C:/Program Files/1cv8/8.5.1.1423/bin/shquery_ru.hbk"
# prefix = "query__"
# scheme = "SyntaxHelperQueries"

# Справка по командной строке 1C:EDT (префикс edtcli__, раздел edt).
# edt_docs = true — при сборке добавить статьи из вывода 1cedtcli, если он найден.
# edt_cli = "" — явный путь к 1cedtcli; пусто = автодискавери (реестр / известные каталоги).
# edt_docs = true
# edt_cli = "C:/Program Files/1C/1CE/components/1c-edt-2026.1.3+25-x86_64/1cedtcli.exe"

[search]
backend = "fts"     # fts | hybrid | vectors
limit = 10

[build]
cleanup = false
chunk_size = 1500     # целевой размер чанка при разбиении длинных статей (символов)
chunk_overlap = 200   # перекрытие соседних чанков

# Эмбеддер для векторного/гибридного поиска (опционально).
# Модель эмбеддинга ОБЯЗАНА совпадать с моделью, которой построен индекс
# (готовый индекс собран на bge-m3, 1024 dims).
# provider: "openai" (по умолчанию) — LM Studio, Ollama и прочие OpenAI-совместимые;
#           "hf" — Hugging Face Inference native (router.huggingface.co, см. README).
# [embedder.index]
# provider = "openai"
# model = "text-embedding-bge-m3"
# base_url = "http://localhost:1234/v1"
# api_key = ""
# dims = 1024
# batch_size = 64
# embed_chars = 500   # усечение тела страницы перед эмбеддингом (символов)

# [embedder.query]
# provider = "hf"
# model = "BAAI/bge-m3"
# base_url = "https://router.huggingface.co/hf-inference/models"
# api_key = "<HF_TOKEN>"
# dims = 1024
